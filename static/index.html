<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>certificate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <form id="form" onsubmit="return false;">
      <div class="row">
        <div class="field">
          <label for="name">name</label>
          <input type="text" id="name" value="mtu skthu" autocomplete="off">
        </div>
        <div class="field">
          <label for="date">date</label>
          <div class="date-row">
            <input type="text" id="date" value="13 November 2026" autocomplete="off">
            <input type="date" id="datePicker" value="2026-11-13" title="choose date from calendar">
          </div>
        </div>
      </div>
      <div class="buttons">
        <button type="button" id="pdfBtn">download pdf</button>
      </div>
    </form>

    <div class="preview">
      <canvas id="canvas" width="3508" height="2481"></canvas>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
